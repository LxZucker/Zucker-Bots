
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuckerBot</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #080808;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 390px;
  text-align: center;
}

.logo {
  font-size: 65px;
  font-weight: 900;
  letter-spacing: -8px;
  margin-bottom: 5px;
}

.logo .z {
  color: #ff2020;
  text-shadow: 0 0 12px red, 0 0 30px #ff2020;
}

.logo .b {
  color: #00ff55;
  text-shadow: 0 0 12px #00ff55, 0 0 30px #00ff55;
}

.brand {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 8px;
}

.brand span {
  color: #00ff55;
}

.subtitle {
  color: #777;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 35px;
}

.panel {
  background: #111;
  border: 1px solid #292929;
  border-radius: 15px;
  padding: 27px 22px;
  text-align: left;
}

.panel h2 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 21px;
}

.field {
  margin-bottom: 17px;
}

label {
  display: block;
  font-size: 13px;
  color: #bbb;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  background: #080808;
  border: 1px solid #333;
  border-radius: 8px;
  color: white;
  outline: none;
}

input:focus {
  border-color: #00ff55;
  box-shadow: 0 0 8px #00ff5533;
}

.main-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #00e64d;
  color: black;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.main-btn:active {
  transform: scale(.98);
}

.main-btn:disabled {
  opacity: .6;
  cursor: wait;
}

.switch {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 22px;
}

.switch a {
  color: #00ff55;
  text-decoration: none;
  cursor: pointer;
  font-weight: bold;
}

.message {
  text-align: center;
  font-size: 13px;
  margin-top: 12px;
  color: #00ff55;
  overflow-wrap: anywhere;
}

.hidden {
  display: none;
}

.footer {
  margin-top: 25px;
  font-size: 11px;
  color: #444;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <span class="z">Z</span><span class="b">B</span>
  </div>

  <div class="brand">Zucker<span>Bot</span></div>
  <div class="subtitle">WHATSAPP BOT PLATFORM</div>

  <div class="panel">

    <!-- CADASTRO -->
    <form id="register">
      <h2>Criar sua conta</h2>

      <div class="field">
        <label>Nome de usuário</label>
        <input id="username" type="text"
          placeholder="Escolha seu nome"
          minlength="3" maxlength="20"
          autocomplete="username" required>
      </div>

      <div class="field">
        <label>Senha</label>
        <input id="password" type="password"
          placeholder="Crie uma senha"
          minlength="8"
          autocomplete="new-password" required>
      </div>

      <div class="field">
        <label>Confirmar senha</label>
        <input id="confirm" type="password"
          placeholder="Repita sua senha"
          autocomplete="new-password" required>
      </div>

      <button class="main-btn" id="registerButton" type="submit">
        CRIAR CONTA
      </button>

      <p class="switch">
        Já possui uma conta?
        <a href="#" id="goLogin">Entrar</a>
      </p>
    </form>

    <!-- LOGIN -->
    <form id="login" class="hidden">
      <h2>Bem-vindo de volta</h2>

      <div class="field">
        <label>Nome de usuário</label>
        <input id="loginUsername" type="text"
          placeholder="Seu usuário"
          autocomplete="username" required>
      </div>

      <div class="field">
        <label>Senha</label>
        <input id="loginPassword" type="password"
          placeholder="Sua senha"
          autocomplete="current-password" required>
      </div>

      <button class="main-btn" id="loginButton" type="submit">
        ENTRAR
      </button>

      <p class="switch">
        Não possui uma conta?
        <a href="#" id="goRegister">Criar conta</a>
      </p>
    </form>

    <p id="message" class="message"></p>

  </div>

  <div class="footer">
    ZUCKERBOT © 2026 — TODOS OS DIREITOS RESERVADOS
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://khkjlodngoahevxkxswj.supabase.co";

const SUPABASE_KEY = "sb_publishable_rotySSsmUkOouZSUf0O-Sg_RbMJMumQ";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const register = document.getElementById("register");
const login = document.getElementById("login");
const message = document.getElementById("message");

function showLogin() {
  register.classList.add("hidden");
  login.classList.remove("hidden");
  message.textContent = "";
}

function showRegister() {
  login.classList.add("hidden");
  register.classList.remove("hidden");
  message.textContent = "";
}

document.getElementById("goLogin").addEventListener("click", function(e) {
  e.preventDefault();
  showLogin();
});

document.getElementById("goRegister").addEventListener("click", function(e) {
  e.preventDefault();
  showRegister();
});

// CADASTRO
register.addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.getElementById("username")
    .value.trim().toLowerCase();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm").value;
  const button = document.getElementById("registerButton");

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    message.textContent =
      "Use de 3 a 20 caracteres: letras, números ou _.";
    return;
  }

  if (password.length < 8) {
    message.textContent =
      "A senha precisa ter pelo menos 8 caracteres.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent = "As senhas não coincidem!";
    return;
  }

  button.disabled = true;
  message.textContent = "Criando sua conta...";

  try {
    const response = await fetch("/api/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password,
        confirmPassword
      })
    });

    const data = await response.json();

    if (!response.ok) {
      message.textContent =
        data.error || "Não foi possível criar sua conta.";
      return;
    }

    message.textContent =
      "Conta criada com sucesso! Agora faça login.";

    register.reset();

    setTimeout(showLogin, 1500);

    document.getElementById("loginUsername").value = username;

  } catch (error) {
    message.textContent =
      "Erro de conexão. Tente novamente.";
  } finally {
    button.disabled = false;
  }
});

// LOGIN
login.addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.getElementById("loginUsername")
    .value.trim().toLowerCase();

  const password = document.getElementById("loginPassword").value;
  const button = document.getElementById("loginButton");

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    message.textContent = "Nome de usuário inválido.";
    return;
  }

  button.disabled = true;
  message.textContent = "Entrando na sua conta...";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: `${username}@login.zuckerbot.invalid`,
      password: password
    });

    if (error) {
      message.textContent = "Usuário ou senha incorretos.";
      return;
    }

    message.textContent =
      "Login realizado com sucesso! Bem-vindo ao ZuckerBot!";

    console.log("Usuário autenticado:", data.user.id);

  } catch (error) {
    message.textContent =
      "Erro de conexão. Tente novamente.";
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
